name: Windows production release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select production version
        id: version
        shell: pwsh
        run: |
          ./tests/ReleaseVersion.Checks.ps1
          $version = ./installer/Get-ReleaseVersion.ps1
          if (-not $version) {
            'skip=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          $release = gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($release | ConvertFrom-Json).isDraft) {
            'skip=true' >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Check simulation and action decisions
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet run --project tests/FlyGuy.Checks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Simulation checks failed.' }
          dotnet run --project tests/FlyGuy.Conversation.Checks -c Release -- --actions-only
          if ($LASTEXITCODE -ne 0) { throw 'Action checks failed.' }
      - name: Build installer
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: ./installer/Build-Velopack.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: FlyGuy-windows-${{ steps.version.outputs.number }}
          path: artifacts/velopack/${{ steps.version.outputs.number }}/
          if-no-files-found: error
      - name: Publish complete stable release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath "artifacts/velopack/$env:RELEASE_VERSION" -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Fly Guy $env:RELEASE_VERSION" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          gh release edit $env:RELEASE_TAG --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not set release commit.' }
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished.' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
